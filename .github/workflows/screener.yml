name: Judas Swing Screener

on:
  schedule:
    # 04:45 UTC соответствует 07:45 UTC+3 (Понедельник - Пятница)
    # Ранний запуск компенсирует возможные задержки в очереди GitHub
    - cron: '45 4 * * 1-5'
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 210 # Лимит безопасности на 3.5 часа

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Judas Screener
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python judas_screener.py
